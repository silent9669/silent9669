<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Dang Phuc anime profile banner</title>
  <desc id="desc">A twilight anime-inspired banner with sakura and a moon.</desc>
  <defs>
